[package]
name = "msedge-tts"
version = "0.3.0"
edition = "2024"
description = "This library is a wrapper of MSEdge Read aloud function API. You can use it to synthesize text to speech with many voices MS provided."
license = "MIT OR Apache-2.0"
repository = "https://github.com/hs-CN/msedge-tts"
keywords = ["tts", "text-to-speech", "msedge-tts", "edge-tts"]
categories = ["multimedia::audio"]
readme = "README.md"
exclude = ["examples/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


[features]
default = ["blocking"]
proxy = [
    "ureq?/socks-proxy",
    "reqwest?/socks",
    "rustls",
    "rustls-platform-verifier",
    "http",
    "httparse",
    "base64",
]
blocking = [
    "ureq",
    "tungstenite/__rustls-tls",
    "rustls",
    "rustls-platform-verifier",
]
smol-runtime = [
    "reqwest",
    "async-compat",
    "async-tungstenite/smol-runtime",
    "async-tungstenite/futures-rustls-platform-verifier",
    "smol",
]
tokio-runtime = ["reqwest"]
gio-runtime = []


[dependencies]
chrono = "0.4.44"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
tungstenite = "0.29.0"
uuid = { version = "1.23.1", features = ["fast-rng", "v4"] }

[dependencies.ureq]
version = "3.3.0"
optional = true
default-features = false
features = ["gzip", "json", "rustls-no-provider", "platform-verifier"]

[dependencies.reqwest]
version = "0.13.3"
optional = true
features = ["gzip", "json"]

[dependencies.async-compat]
version = "0.2.5"
optional = true

[dependencies.rustls]
version = "0.23.40"
optional = true

[dependencies.rustls-platform-verifier]
version = "0.7.0"
optional = true

[dependencies.http]
version = "1.4.0"
optional = true

[dependencies.httparse]
version = "1.10.1"
optional = true

[dependencies.base64]
version = "0.22.1"
optional = true

[dependencies.async-tungstenite]
version = "0.34.1"
optional = true

[dependencies.smol]
version = "2.0.2"
optional = true


[dev-dependencies]
tokio = { version = "1.52.3", features = ["net", "rt", "time"] }
rodio = "0.22.2"
smol = "2.0.2"


[[example]]
name = "get_voices_list_proxy"
required-features = ["proxy"]

[[example]]
name = "synthesize_proxy"
required-features = ["proxy"]

[[example]]
name = "synthesize_stream_proxy"
required-features = ["proxy"]

[[example]]
name = "get_voices_list_smol_async"
required-features = ["smol-runtime"]

[[example]]
name = "synthesize_smol_async"
required-features = ["smol-runtime"]

[[example]]
name = "synthesize_stream_smol_async"
required-features = ["smol-runtime"]

[[example]]
name = "get_voices_list_proxy_smol_async"
required-features = ["smol-runtime", "proxy"]

[[example]]
name = "get_voices_list_tokio_async"
required-features = ["tokio-runtime"]

[[example]]
name = "get_voices_list_proxy_tokio_async"
required-features = ["tokio-runtime", "proxy"]
